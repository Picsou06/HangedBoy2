stages:
  - test
  - sonarqube
  - build
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  SERVER_IMAGE: $DOCKERHUB_USERNAME/hangedboy2-server
  CLIENT_IMAGE: $DOCKERHUB_USERNAME/hangedboy2-client

default:
  tags:
    - dind

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository/

test:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  script:
    - mvn test
  only:
    - main

sonarqube:
  stage: sonarqube
  image: maven:3.9-eclipse-temurin-17
  needs: [test]
  script:
    - mvn verify sonar:sonar
        -Dsonar.projectKey=$SONAR_PROJECT_KEY
        -Dsonar.organization=$SONAR_ORGANIZATION
        -Dsonar.token=$SONAR_TOKEN
  only:
    - main

build:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  needs: [sonarqube]
  script:
    - mvn package -DskipTests
  artifacts:
    name: "jars-$CI_COMMIT_SHORT_SHA"
    paths:
      - server/target/server-standalone.jar
      - client/target/client-standalone.jar
    expire_in: 1 week
  only:
    - main

deploy:
  stage: deploy
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  needs: [build]
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json <<EOF
      {"auths":{"https://index.docker.io/v1/":{"username":"$DOCKERHUB_USERNAME","password":"$DOCKERHUB_TOKEN"}}}
      EOF
  script:
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile "$CI_PROJECT_DIR/server/Dockerfile" --destination "$SERVER_IMAGE:latest" --destination "$SERVER_IMAGE:$CI_COMMIT_SHORT_SHA"
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile "$CI_PROJECT_DIR/client/Dockerfile" --destination "$CLIENT_IMAGE:latest" --destination "$CLIENT_IMAGE:$CI_COMMIT_SHORT_SHA"
  only:
    - main
